name: Build Rolling Bass Lab

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest CMake
        uses: lukka/get-cmake@latest

      - name: Find project folder
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Filter CMakeLists.txt -Recurse -Depth 2 | Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $file) { Write-Error "No CMakeLists.txt found in the repo"; exit 1 }
          $dir = $file.DirectoryName
          Write-Host "Using project folder: $dir"
          "SRC_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Visual Studio 18 2026)
        run: cmake -S "${{ env.SRC_DIR }}" -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RollingBassLab-VST3-Windows
          path: build/RollingBassLab_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone app
        uses: actions/upload-artifact@v4
        with:
          name: RollingBassLab-Standalone-Windows
          path: build/RollingBassLab_artefacts/Release/Standalone/
          if-no-files-found: warn
